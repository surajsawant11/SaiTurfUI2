<div class="contact-page bg-gray-50 py-12 mt-5">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-3xl"> <!-- Centered container -->
      <!-- Page Heading -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Contact Us</h1>
        <p class="text-lg text-gray-600 mt-2">We're here to help! Reach out to us for any inquiries or support.</p>
      </div>
  
      <!-- Contact Form -->
      <div class="bg-white p-6 sm:p-8 rounded-lg shadow-md">
        <form>
          <!-- Name Input -->
          <div class="mb-6">
            <label for="name" class="block text-sm font-medium text-gray-700">Your Name</label>
            <input
              type="text"
              id="name"
              name="name"
              class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="John Doe"
              required
            />
          </div>
  
          <!-- Email Input -->
          <div class="mb-6">
            <label for="email" class="block text-sm font-medium text-gray-700">Your Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="johndoe@example.com"
              required
            />
          </div>
  
          <!-- Message Input -->
          <div class="mb-6">
            <label for="message" class="block text-sm font-medium text-gray-700">Your Message</label>
            <textarea
              id="message"
              name="message"
              rows="4"
              class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="How can we help you?"
              required
            ></textarea>
          </div>
  
          <!-- Submit Button -->
          <div class="text-center">
            <button
              type="submit"
              class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg text-lg font-semibold hover:bg-green-700 transition duration-300"
            >
              Send Message
            </button>
          </div>
        </form>
      </div>
  
      <!-- Contact Details -->
      <div class="mt-8 text-center">
        <h2 class="text-xl font-semibold text-gray-900 mb-4">Contact Information</h2>
        <div class="space-y-2 text-gray-600">
          <p><i class="fas fa-map-marker-alt text-green-600"></i> 123 Turf Lane, Sports City, SC 12345</p>
          <p><i class="fas fa-phone-alt text-green-600"></i> +1 (123) 456-7890</p>
          <p><i class="fas fa-envelope text-green-600"></i> support&#64;turfbooking.com</p>
        </div>
      </div>
    </div>
  </div>
