<div class="container my-4">
  <div class="swiper-container">
    <div class="swiper-wrapper">
      <!-- Swiper slides looped dynamically from data -->
      <div class="swiper-slide" *ngFor="let slide of slides">
        <img [src]="slide.image" class="d-block w-100" [alt]="slide.alt">
      </div>
    </div>
    <div class="swiper-pagination"></div>
    <!-- <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div> -->
  </div>
</div>

<!-- Available Turfs -->
<div class="container my-5">
  <h2 class="text-center mb-4">Available Turfs</h2>
  <div class="row">
    <!-- Loop through turfs to generate the cards dynamically -->
    <div class="col-md-4 col-sm-6 mb-4" *ngFor="let turf of turfs">
      <div class="turf-card">
        <img [src]="turf.image" class="card-img-top" [alt]="turf.name">
        <div class="card-body">
          <h5 class="card-title">{{ turf.name }}</h5>
          <p class="card-text">{{ turf.description }}</p>
          <p class="card-text"><strong>Price:</strong> {{ turf.price }}</p>
          <button class="btn btn-custom">View Details</button>
          <button class="btn btn-primary mt-2">Book Now</button> <!-- Added Book Now Button -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Testimonials Section -->
<div class="container my-5">
  <h2 class="text-center mb-4">What Our Users Say</h2>
  <div class="row">
    <!-- Loop through testimonials to display each testimonial card -->
    <div class="col-md-4 col-sm-6 mb-4" *ngFor="let testimonial of testimonials">
      <div class="testimonial-card text-center">
        <img [src]="testimonial.image" class="rounded-circle mb-3" [alt]="testimonial.name"
          style="width: 80px; height: 80px;">
        <p>"{{ testimonial.feedback }}"</p>
        <p>- {{ testimonial.name }}</p>
      </div>
    </div>
  </div>
</div>
