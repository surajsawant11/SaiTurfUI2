<h2 mat-dialog-title>{{ data ? 'Edit Turf' : 'Add New Turf' }}</h2>
<div mat-dialog-content>
  <form [formGroup]="turfForm">
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Location</mat-label>
      <input matInput formControlName="location">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Price Per Hour</mat-label>
      <input matInput type="number" formControlName="pricePerHour">
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Capacity</mat-label>
      <input matInput type="number" formControlName="capacity">
    </mat-form-field>

    <!-- Image Preview -->
    <div class="image-preview-container">
      <input type="file" (change)="onFileSelected($event)">
      <div *ngIf="imagePreview()">
        <img [src]="imagePreview()" alt="Turf Image" class="w-48 h-48 rounded-lg border border-gray-300 object-cover shadow-md">
      </div>
    </div>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onSave()" [disabled]="turfForm.invalid">Save</button>
</div>
