<div class="bg-white shadow-lg rounded-lg p-6 w-full mx-auto ">
  <h2 class="text-2xl font-bold text-center mb-4 text-green-700">
    {{ data ? 'Edit Turf' : 'Add New Turf' }}
  </h2>

  <form [formGroup]="turfForm" class="space-y-4">
    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Name</label>
      <input type="text" formControlName="name"
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 outline-none transition"
        placeholder="Enter Turf Name">
    </div>

    <!-- Location -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Location</label>
      <input type="text" formControlName="location"
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 outline-none transition"
        placeholder="Enter Location">
    </div>

    <!-- Price Per Hour -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Price Per Hour</label>
      <input type="number" formControlName="pricePerHour"
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 outline-none transition"
        placeholder="Enter Price">
    </div>

    <!-- Capacity -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Capacity</label>
      <input type="number" formControlName="capacity"
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-green-500 outline-none transition"
        placeholder="Enter Capacity">
    </div>

    <!-- Image Upload -->
    <div class="flex flex-col items-center border-dashed border-2 border-gray-300 p-4 rounded-md bg-gray-50">
      <label class="text-gray-600 font-medium mb-2">Upload Image</label>
      <input type="file" class="hidden" (change)="onFileSelected($event)" id="fileInput">
      <label for="fileInput"
        class="cursor-pointer bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition">
        Choose File
      </label>

      <div *ngIf="imagePreview()" class="mt-3">
        <img [src]="imagePreview()" alt="Turf Image" class="w-40 h-40 rounded-md shadow-md object-cover">
      </div>
    </div>
  </form>
  
  <!-- Dialog Actions -->
  <div class="flex justify-end space-x-4 mt-6 bg-white py-4 w-full">
    <button
      class="px-6 py-2 bg-gray-500 text-white rounded-lg transition duration-300 ease-in-out transform hover:bg-gray-600 hover:scale-105 active:scale-95 shadow-md"
      (click)="onCancel()" style="padding: 30px; margin: 0px; margin-right: 10px;">Cancel</button>
    <button
      class="px-6 py-2 bg-green-500 text-white rounded-lg transition duration-300 ease-in-out transform hover:bg-green-600 hover:scale-105 active:scale-95 shadow-md"
      (click)="onSave()" style="padding: 30px; margin: 0px;">Save</button>
  </div>
</div>
