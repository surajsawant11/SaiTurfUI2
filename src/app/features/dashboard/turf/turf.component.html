<div class="contact-page bg-gray-50 py-12 mt-5">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-3xl">

        <div class="p-4">
            <h1 class="text-2xl font-bold mb-4">All Turfs</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                @for (turf of turfs; track turf.id) {
                <div class="bg-white shadow-lg rounded-lg p-4">
                    <h2 class="text-xl font-semibold">{{ turf.name }}</h2>
                    <p class="text-gray-600">{{ turf.location }}</p>
                    <p class="text-gray-600">{{ turf.size }}</p>
                </div>}
            </div>
        </div>

    </div>
</div>
