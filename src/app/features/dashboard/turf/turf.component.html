<div class="contact-page bg-gray-50 py-12 mt-5">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-3xl">

        <div class="flex justify-end mb-4">
            <button class="bg-green-500 text-white font-medium py-2 px-4 rounded shadow hover:bg-green-600 transition"
                (click)="openAddTurfDialog()">
                + Add New Turf
            </button>
        </div>

        <!-- Responsive Table Wrapper -->
        <div class="table-responsive">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                    <td mat-cell *matCellDef="let turf" @fadeIn> {{turf.name}} </td>
                </ng-container>

                <!-- Location Column -->
                <ng-container matColumnDef="location">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Location </th>
                    <td mat-cell *matCellDef="let turf" @fadeIn> {{turf.location}} </td>
                </ng-container>

                <!-- Price Per Hour Column -->
                <ng-container matColumnDef="pricePerHour">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Price Per Hour </th>
                    <td mat-cell *matCellDef="let turf" @fadeIn> ₹{{turf.pricePerHour}} </td>
                </ng-container>

                <!-- Capacity Column -->
                <ng-container matColumnDef="capacity">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Capacity </th>
                    <td mat-cell *matCellDef="let turf" @fadeIn> {{turf.capacity}} </td>
                </ng-container>

                <!-- Image Column -->
                <ng-container matColumnDef="imageUrl">
                    <th mat-header-cell *matHeaderCellDef> Image </th>
                    <td mat-cell *matCellDef="let turf" @fadeIn>
                        <img [src]="turf.imageUrl" alt="Turf Image" class="turf-img">
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let turf" @fadeIn class="action-buttons">
                        <button mat-icon-button color="primary" (click)="onEdit(turf)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="onDelete(turf)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <!-- Table Rows -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" @fadeIn></tr>
            </table>
        </div>

        <!-- Paginator -->
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

    </div>
</div>
