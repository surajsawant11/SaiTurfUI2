<div class="min-h-screen w-full bg-gray-50 flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center space-y-8">
            <!-- SVG container with responsive sizing -->
            <div class="w-full max-w-2xl">
                <svg viewBox="0 0 800 600" class="w-full h-auto">
                    <!-- Background -->
                    <rect width="800" height="600" fill="#f5f5f5" />

                    <!-- 404 Text -->
                    <text x="400" y="200" font-family="Arial" font-size="120" font-weight="bold" text-anchor="middle"
                        fill="#333">
                        404
                    </text>

                    <!-- Basketball -->
                    <circle cx="350" cy="350" r="80" fill="#f97316" stroke="#333" stroke-width="3" />
                    <path d="M350 270 Q 430 350 350 430 Q 270 350 350 270" fill="none" stroke="#333" stroke-width="3" />
                    <path d="M270 350 L430 350" fill="none" stroke="#333" stroke-width="3" />

                    <!-- Bouncing Effect Lines -->
                    <path d="M280 450 Q 350 470 420 450" fill="none" stroke="#666" stroke-width="3"
                        stroke-dasharray="10,5" />

                    <!-- Missing Net -->
                    <path d="M500 300 C 520 300, 540 310, 540 340 C 540 370, 520 380, 500 380" fill="none" stroke="#666"
                        stroke-width="3" stroke-dasharray="5,5" />

                    <!-- Error Message -->
                    <text x="400" y="500" font-family="Arial" font-size="24" text-anchor="middle" fill="#666">
                        Oops! The page is out of bounds!
                    </text>
                </svg>
            </div>


            <button (click)="goToHome()" class="group inline-flex items-center bg-orange-500 text-white px-4 py-2 font-medium text-sm transition-all duration-300 hover:bg-blue-700
            hover:shadow-lg hover:text-white hover:bg-slate-800 hover:border-slate-800 
            focus:text-white focus:bg-slate-800 focus:border-slate-800
            active:text-white active:bg-slate-800 active:border-slate-800
            disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none rounded transition-all"
                type="button">
                Homepage
                <svg class="hidden group-hover:inline-flex ml-2 w-4 h-4 transition-all duration-300"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>

        </div>
    </div>
</div>
